services:
  # PostgreSQL Database
  database:
    image: postgres:16-alpine
    container_name: arenaserve-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: arenareserve
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arenareserve"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arenaserve-network-dev

  # Redis
  redis:
    image: redis:7-alpine
    container_name: arenaserve-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arenaserve-network-dev

  # Backend API (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: arenaserve-backend-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: /api
      DATABASE_URL: postgresql://postgres:1234@database:5432/arenareserve?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-token-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_your_stripe_secret_key}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_your_stripe_publishable_key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_your_webhook_secret}
      KASPI_API_URL: ${KASPI_API_URL:-https://api.kaspi.kz}
      KASPI_API_KEY: ${KASPI_API_KEY:-}
      KASPI_MERCHANT_ID: ${KASPI_MERCHANT_ID:-}
      KASPI_WEBHOOK_SECRET: ${KASPI_WEBHOOK_SECRET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-arenareserve-uploads}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FRONTEND_URL: http://localhost:3001
      DEFAULT_TIMEZONE: Asia/Almaty
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/public/uploads:/app/public/uploads
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Ожидание PostgreSQL в Docker...' &&
        sleep 5 &&
        echo 'Создание схемы базы данных из schema.prisma...' &&
        npx prisma db push --accept-data-loss --skip-generate &&
        echo 'Схема создана' &&
        npx prisma generate &&
        echo 'Применение constraint...' &&
        (PGPASSWORD=1234 psql -h database -p 5432 -U postgres -d arenareserve -f prisma/apply-constraint.sql 2>/dev/null || echo 'Constraint уже применен') &&
        echo 'Помечаем миграцию как примененную...' &&
        npx prisma migrate resolve --applied 20250101000000_add_booking_exclude_constraint 2>/dev/null || echo 'Миграция уже помечена' &&
        echo 'Инициализация данных (если база пустая)...' &&
        (node prisma/init-docker-data.js || echo 'Warning: init-docker-data failed, starting server anyway') &&
        npm run dev
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - arenaserve-network-dev

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: arenaserve-frontend-dev
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - arenaserve-network-dev
    command: sh -c "npm install xlsx && npm run dev -- --host 0.0.0.0 --no-open"

  # Node Exporter (host metrics)
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: arenaserve-node-exporter-dev
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro
    ports:
      - "9101:9100"
    networks:
      - arenaserve-network-dev

  # cAdvisor (container metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: arenaserve-cadvisor-dev
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8082:8080"
    networks:
      - arenaserve-network-dev

  # Blackbox Exporter (project endpoint probes)
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: arenaserve-blackbox-exporter-dev
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9116:9115"
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Pushgateway (push metrics endpoint)
  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: arenaserve-pushgateway-dev
    ports:
      - "9095:9091"
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Graphite (long-term metrics storage)
  graphite:
    image: graphiteapp/graphite-statsd:1.1.10-4
    container_name: arenaserve-graphite-dev
    environment:
      GRAPHITE_TIME_ZONE: Asia/Almaty
    ports:
      - "8003:80"        # Web UI
      - "2003:2003"      # Carbon plaintext
      - "2004:2004"      # Carbon pickle
      - "8125:8125/udp"  # StatsD UDP
      - "8125:8125/tcp"  # StatsD TCP
    volumes:
      - graphite_data_dev:/opt/graphite/storage
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Telegraf (Prometheus → Graphite bridge)
  telegraf:
    image: telegraf:latest
    container_name: arenaserve-telegraf-dev
    volumes:
      - ./monitoring/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - prometheus
      - graphite
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Zabbix (infrastructure monitoring)
  zabbix:
    image: zabbix/zabbix-appliance:latest
    container_name: arenaserve-zabbix-dev
    ports:
      - "8084:80"       # Zabbix Web UI
      - "10051:10051"   # Zabbix server trapper
    volumes:
      - zabbix_data_dev:/var/lib/mysql
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Nagios (infrastructure monitoring)
  nagios:
    image: jasonrivers/nagios:latest
    container_name: arenaserve-nagios-dev
    ports:
      - "8085:80"       # Nagios Web UI
    volumes:
      - nagios_data_dev:/opt/nagios/etc
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Alertmanager (notifications)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: arenaserve-alertmanager-dev
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-smtp.gmail.com:587}
      SMTP_FROM: ${SMTP_FROM:-alerts@example.com}
      SMTP_AUTH_USERNAME: ${SMTP_AUTH_USERNAME:-}
      SMTP_AUTH_PASSWORD: ${SMTP_AUTH_PASSWORD:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-ops@example.com}
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9094:9093"
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Prometheus (metrics + alert rules)
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: arenaserve-prometheus-dev
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data_dev:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - node-exporter
      - cadvisor
      - blackbox-exporter
      - pushgateway
      - alertmanager
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Grafana (dashboards)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: arenaserve-grafana-dev
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3003:3000"
    depends_on:
      - prometheus
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Portainer (Docker container management UI)
  portainer:
    image: portainer/portainer-ce:lts
    container_name: arenaserve-portainer-dev
    command: -H unix:///var/run/docker.sock
    ports:
      - "9001:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data_dev:/data
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # n8n (AI workflow automation)
  n8n:
    image: n8nio/n8n:latest
    container_name: arenaserve-n8n-dev
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_RUNNERS_ENABLED: "true"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-admin123}
      N8N_AI_GATE_TOKEN: ${N8N_AI_GATE_TOKEN:-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TZ: Asia/Almaty
    ports:
      - "5678:5678"
    volumes:
      - n8n_data_dev:/home/node/.n8n
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Jenkins (CI/CD)
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: arenaserve-jenkins-dev
    user: root
    ports:
      - "8088:8080"
      - "50000:50000"
    volumes:
      - jenkins_home_dev:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - arenaserve-network-dev
    restart: unless-stopped


  # OPA (policy engine)
  opa:
    image: openpolicyagent/opa:latest
    container_name: arenaserve-opa-dev
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--set=decision_logs.console=true"
    ports:
      - "8182:8181"
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # OPAL Server (policy distribution)
  opal-server:
    image: permitio/opal-server:latest
    container_name: arenaserve-opal-server-dev
    environment:
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 7002
      OPAL_POLICY_REPO_URL: ${OPAL_POLICY_REPO_URL:-https://github.com/permitio/opal-example-policy-repo.git}
      OPAL_POLICY_REPO_POLLING_INTERVAL: ${OPAL_POLICY_REPO_POLLING_INTERVAL:-60}
    depends_on:
      - opa
    ports:
      - "7002:7002"
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

  # Telegram Bot (interactive commands)
  telegram-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: arenaserve-telegram-bot-dev
    environment:
      NODE_ENV: development
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GRAFANA_URL: http://grafana:3000
      PROMETHEUS_URL: http://prometheus:9090
      GRAPHITE_URL: http://graphite:80
    command: node src/workers/telegramBot.js
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
      - grafana
      - prometheus
    networks:
      - arenaserve-network-dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  prometheus_data_dev:
    driver: local
  grafana_data_dev:
    driver: local
  portainer_data_dev:
    driver: local
  graphite_data_dev:
    driver: local
  zabbix_data_dev:
    driver: local
  nagios_data_dev:
    driver: local
  n8n_data_dev:
    driver: local
  jenkins_home_dev:
    driver: local

networks:
  arenaserve-network-dev:
    driver: bridge

