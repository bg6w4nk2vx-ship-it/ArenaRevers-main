[global_tags]
  # Tags to add to all metrics
  env = "dev"

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  hostname = "telegraf"
  omit_hostname = false

###############################################################################
#                            INPUT PLUGINS                                   #
###############################################################################

# Scrape Prometheus /metrics endpoint directly (simpler & more reliable)
[[inputs.prometheus]]
  urls = [
    "http://backend:3000/metrics",
    "http://prometheus:9090/metrics",
    "http://node-exporter:9100/metrics",
    "http://cadvisor:8080/metrics",
    "http://blackbox-exporter:9115/metrics",
    "http://alertmanager:9093/metrics"
  ]
  response_timeout = "10s"

###############################################################################
#                            OUTPUT PLUGINS                                  #
###############################################################################

# Send metrics to Graphite
[[outputs.graphite]]
  servers = ["graphite:2003"]
  prefix = "arena."
  template = "tag.measurement.field"
  timeout = "5s"

  # Keep tags in metric names for Graphite compatibility
  graphite_tag_support = true

# Also keep sending to stdout for debugging
[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
